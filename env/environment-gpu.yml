name: dftgnn-gpu
# Linux CUDA pod. Only python comes from conda; every compiled package comes from PyPI, so one OpenMP runtime
# is loaded. torch, torch_geometric, matgl and mace-torch are pinned to the versions the local env and the
# graph store were built with; the rest resolve on the first pod build and are recorded in env/lock-gpu.txt.
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.13.0            # PyPI Linux wheel bundles CUDA 12 runtime libraries
      - torch_geometric==2.8.0.post1
      - matgl==4.1.0
      - mace-torch==0.3.16       # MACE-MP-0 medium relaxations; same version as the local env
      - numpy
      - scipy
      - pandas
      - pyarrow
      - scikit-learn
      - pymatgen
      - ase
      - optuna
      - pyyaml
      - pydantic
      - pytest
      - ruff
      - tqdm
